# InstaGPU login theme (production): Keycloak's built-in v2 theme (PatternFly 5) plus the frontend's look (css/instagpu.css) and a
# brand panel (template.ftl). No dev helpers here: the dev realm uses the child theme "instagpu-dev", which adds the "Sign in as" picker.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/instagpu.css
darkMode=true
